name: CI
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare the declared official tunnel fixture
        run: |
          node scripts/install-tunnel-fixture.mjs "${{ runner.temp }}/tunnel-fixture"
          echo "KIOKUKO_TUNNEL_CLIENT=${{ runner.temp }}/tunnel-fixture/tunnel-client" >> "$GITHUB_ENV"
      - name: Run repository verification (main)
        run: npm run verify -- --profile main --output "${{ runner.temp }}/verification-verify"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-verify-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-verify
          if-no-files-found: error
  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository verification (semantic)
        run: npm run verify -- --profile semantic --output "${{ runner.temp }}/verification-semantic-platform-smoke"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-semantic-platform-smoke-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-semantic-platform-smoke
          if-no-files-found: error
  record-replay:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Install the published recorder
        run: npm install --global agenticreplay@0.1.2 --ignore-scripts --no-audit --no-fund
      - name: Run repository verification (record)
        run: npm run verify -- --profile record --output "${{ runner.temp }}/verification-record-replay"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-record-replay-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-record-replay
          if-no-files-found: error
